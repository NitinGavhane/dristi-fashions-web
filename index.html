<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {
          console.warn('Fetch patch error:', err);
        }
      })();
    </script>
    <script>
      // The site was previously a Flutter web build, which installed a service
      // worker that can keep serving the old app to returning visitors. This
      // React build ships no service worker, so remove any leftover registration
      // (and its caches) once and reload so the new build takes over cleanly.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () {
              return (window.caches && caches.keys)
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  })
                : null;
            })
            .then(function () { window.location.reload(); });
        }).catch(function () {});
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0d1648" />

    <!-- Emblem-only icons cut from assets/logo.png; the full lockup's wordmark
         is unreadable at favicon sizes. Vite fingerprints these on build. -->

    <meta property="og:title" content="Dristi Fashions" />

  </head>

</html>
